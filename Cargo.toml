[workspace]
resolver = "2"
members = ["contracts/*"]

[profile.release]
opt-level = "z"        # Optimize for binary size — critical for Wasm contracts
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "warn"
needless_pass_by_value = "allow"
or_fun_call = "allow"
doc_markdown = "allow"
